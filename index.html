<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="css/styles.css">
  
  <title>Frontend Mentor | Browser extensions manager UI</title>

</head>
<body>
  <header>
    <img src="./assets/images/logo.svg" alt="Logo"/>
    <h3>Extensions</h3>
    <button id="change-mode-btn" class="btn" type="button" aria-label="Toggle dark mode"><img src="./assets/images/icon-moon.svg" alt="Toggle dark mode" id="change-mode-icon"></button>
  </header>
  <main>
    <div class="controls">
      <h1>Extensions List</h1>
      
      <div class="filters" role="group" aria-label="Filter extensions by status">
        <button class="btn filter-btn active" type="button" data-filter="all">All</button>
        <button class="btn filter-btn" type="button" data-filter="active">Active</button>
        <button class="btn filter-btn" type="button" data-filter="inactive">Inactive</button>
      </div>

    </div>

    <ul class="extension-list">
      <li class="extension-item">
        <div class="extension-info">
          <img src="./assets/images/logo-devlens.svg" alt="Dev Lens Icon" class="extension-icon">
          <div>
            <h2 class="extension-name">DevLens</h2>
            <p class="extension-description">Quickly inspect page layouts and visualize element boundaries.</p>
          </div>
        </div>
        <button class="btn toggle-btn" type="button" aria-label="Toggle extension status">Active</button>
      </li>
    </ul>
  
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
